<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Das Rico-Quiz</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

   :root {
  --bg:      #fdf6f0;
  --surface: #ffffff;
  --border:  #f0ddc8;
  --text:    #2b2118;
  --muted:   #a38b78;
  --accent:  #ff7a1a;
  --correct: #2fb872;
  --wrong:   #e5484d;
  --radius:  14px;
}

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 100%;
      max-width: 640px;
      margin-bottom: 28px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 44px;
      width: 100%;
      max-width: 640px;
    }

    .question-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .question-text {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 32px;
    }
    .header 
    {
      font-size:7rex;
    }
    /* ── Question image ── */
    .question-image {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 24px;
      display: none;
    }
    .question-image.show { display: block; }

    /* ── Answers ── */
    .answers { display: flex; flex-direction: column; gap: 12px; }

    .answer-btn {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 16px 20px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color .15s, background .15s, transform .1s;
      position: relative;
      overflow: hidden;
    }
    .answer-btn:hover:not(:disabled) { border-color: var(--accent); background: #ebd34a; }
    .answer-btn:active:not(:disabled) { transform: scale(.98); }

    .answer-key {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--border);
      display: grid; place-items: center;
      font-size: 12px; font-weight: 800;
      flex-shrink: 0;
      transition: background .2s;
    }

    .answer-btn.correct { border-color: var(--correct); background: rgba(34,201,122,.08); animation: pulse-correct .35s ease; }
    .answer-btn.correct .answer-key { background: var(--correct); color: #fff; }
    .answer-btn.wrong   { border-color: var(--wrong);   background: rgba(240,74,106,.08);  animation: pulse-wrong   .35s ease; }
    .answer-btn.wrong   .answer-key { background: var(--wrong);   color: #fff; }
    .answer-btn:disabled { cursor: default; }

    @keyframes pulse-correct {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.025); }
      100% { transform: scale(1); }
    }
    @keyframes pulse-wrong {
      0%,100% { transform: translateX(0); }
      25%     { transform: translateX(-6px); }
      75%     { transform: translateX(6px); }
    }

    /* ── Feedback ── */
    .feedback { margin-top: 20px; padding: 14px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; display: none; }
    .feedback.show    { display: block; }
    .feedback.correct { background: rgba(34,201,122,.1); color: var(--correct); border: 1px solid rgba(34,201,122,.25); }
    .feedback.wrong   { background: rgba(240,74,106,.1);  color: var(--wrong);   border: 1px solid rgba(240,74,106,.25); }

    /* ── Next btn ── */
    .next-btn {
      margin-top: 28px; width: 100%; padding: 16px;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius); font-family: inherit;
      font-size: 15px; font-weight: 700; letter-spacing: .02em;
      cursor: pointer; display: none;
      transition: filter .15s, transform .1s;
    }
    .next-btn.show  { display: block; }
    .next-btn:hover { filter: brightness(1.1); }
    .next-btn:active { transform: scale(.98); }


    /*.start { text-align: center; display: none; }*/
    .start.show { display: block; }
    .start-icon  { font-size: 64px; margin-bottom: 16px; }
    .start-title { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
    .start-sub   { color: var(--muted); font-size: 15px; margin-bottom: 32px; }

    /* ── Result ── */
    .result { text-align: center; display: none; }
    .result.show { display: block; }
    .result-icon  { font-size: 64px; margin-bottom: 16px; }
    .result-title { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
    .result-sub   { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
    .score-badge  {
      display: inline-block; background: var(--accent); color: #fff;
      font-size: 36px; font-weight: 900; padding: 18px 40px;
      border-radius: var(--radius); margin-bottom: 0;
    }
    .result-quote {
      font-size: 15px; color: var(--muted); font-style: italic;
      margin: 20px 0 28px; line-height: 1.5;
    }
    .restart-btn {
      padding: 16px 40px; background: transparent; color: var(--accent);
      border: 2px solid var(--accent); border-radius: var(--radius);
      font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .restart-btn:hover { background: rgba(230, 155, 56, 0.12); }

    .start-btn {
     padding: 16px 40px; background: transparent; color: var(--accent);
      border: 2px solid var(--accent); border-radius: var(--radius);
      font-family: inherit; font-size: 30px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .start-btn:hover { background: rgba(230, 155, 56, 0.12); }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .question-text { font-size: 18px; }
    }
  </style>
</head>
<body>
<div> <h1 class= "header" id="header">Finn Quiz</h1>  
<pre>  
  

</pre>
</div>

<div class ="start" id="start"> <button class="start-btn" id="start-btn" onclick="restart()"> Start </button></div>

<div class="progress-wrap" id="progress">
  <div class="progress-meta">
    <span id="q-label"></span>
    <span id="score-live"></span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<div class="card" id="card">
  <div id="quiz-screen">
    <div class="question-label" id="q-counter"></div>
    <div class="question-text" id="q-text"></div>
    <img class="question-image" id="q-image" src="" alt="" />
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn"></button>
  </div>

  <div class="result" id="result-screen">
    <div class="result-icon"  id="result-icon"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-sub"   id="result-sub"></div>
    <div class="score-badge"  id="score-badge"></div>
    <div class="result-quote" id="result-quote"></div>
    <button class="restart-btn" id="restart-btn" onclick="restart()"></button>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────────────────────
  //  TRANSLATIONS
  // ─────────────────────────────────────────────────────────────
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('card').style.display = 'none';
  document.getElementById('progress').style.display = 'none';






  const i18n = {
    questionOf:   (i, t) => 'Frage ' + i + ' von ' + t,
    questionLabel:(i)    => 'Frage ' + i,
    points:       (n)    => n + ' Punkt' + (n !== 1 ? 'e' : ''),
    next:               'Weiter →',
    showResult:         'Ergebnis anzeigen',
    correct:      (exp) => '✓ Richtig! ' + exp,
    wrong:        (exp) => '✗ Falsch. ' + exp,
    resultSub:    (s,t) => 'Du hast ' + s + ' von ' + t + ' Fragen richtig beantwortet.',
    restart:            'Nochmal spielen',
    start:  'Start',
    header:           'Das Rico-Quiz',
    results: {
      perfect:  { title: 'Perfekt!',        quote: 'Du bist ein wahrer RicExperte  Vieleicht bist du ja sogar Rico persönlich!?? Aber leider warst du schon der 101ste Teilnehmer und hast nichts gewonnen.' },
      great:    { title: 'Gut gemacht!',    quote: 'Starke Leistung! Mit ein bisschen mehr Rico Stalking wird das noch besser.' },
      okay:     { title: 'Nicht schlecht!', quote: 'Du weißt schon einiges – aber da ist noch Luft nach oben. Quetsche Finn noch mehr aus.' },
      poor:     { title: 'Weiter üben!',    quote: 'Du kannst das noch viel besser! Schnapp dir ein Abhörgerät und lungere vor Finn\'s Fenster' }
    }
  };

  // ─────────────────────────────────────────────────────────────
  //  QUESTIONS  (add/edit here)
  //  correct: zero-based index of the right answer
  //  image:   optional path to a photo for this question, e.g. 'images/frage1.jpg'
  //           leave as '' if you don't want an image for that question
  // ─────────────────────────────────────────────────────────────
  const questions = [
      {
        text: 'Wie lautet Rico\'s Nachname?',
        image: 'Images/Buchfink.jpg',
        answers: [ 'Binchiling', 'Buchling','Buchfink','Sperlium', 'Sperle','Sperber'],
        correct: 4,
        explanation: 'Rico ist gerne Vögel. Vieleicht hat er einen?'
      },
       {
        text: 'Was ist Rico\'s Lieblings-Getränk?',
        image: '',
        answers: ['Wasser', 'Flüssiges Uran', 'Mango-Lassie', 'Kirschsaft', 'Spezieege'],
        correct: 2,
        explanation: 'Eigentlich habe ich ihn das erst einmal trinken sehen...'
      },
      {
        text: 'Hat Rico ein Springseil?',
        image: 'Images/springseil.jpg',
        answers: ['Öh Ja', 'NEiiin', 'seine Mutter hat eins', 'Er weiß nicht wo es ist'],
        correct: 2,
        explanation: 'Ein Springseil ist auch was für Jungs'
      },
       {
        text: 'Was ist eine häufige Freizeitaktivität von Rico?',
        image: 'Images/Kröte.jpeg',
        answers: ['Keinen Kredikartenbetrug zu begehen', 'Lesen', '*Nicht* Glücksspiel', 'Videospiele zocken'],
        correct: 3,
        explanation: 'Er findet immer Zeit für eine Runde Mein Krampf, äh ich meine Minecraft'
      },
     
       {
        text: 'Welches Transportations Mittel zieht Finn vor?',
        image: '',
        answers: ['Gehen', 'Züge', 'Teleportieren'],
        correct: 1,
        explanation: 'Teleportieren wäre schneller...'
      },

      {
        text: 'Mit welcher Game-Engine ist Finn vertraut?',
        image: '',
        answers: ['Unreal Engine', 'Godot', 'Unity', 'Game maker'],
        correct: 1,
        explanation: 'Finn hat ein tiefgreifendes Wissen in Godot, da sein Vater ein contributor ist'
      },
      
      {
        text: ' Welche Sportart betreibt Rico regelmäßig?',
        image: '',
        answers: ['Büffel-Jagd','Fußball', 'Football','Seilspringen', 'American-Football', 'Soccer','Niederländisches Lederhosen-Weitspringen', 'Rugby',],
        correct: 5,
        explanation: 'Rico ist fast so hart wie ein Felsen, und so schnell wie ein Rotbraunmanguale'
      },
      {
        text: 'Was ist Freaco\'s Lieblings-Körperteil?',
        image: '',
        answers: ['Arme','Beine', 'Füße', 'Nase', 'Daumen'],
        correct: 2,
        explanation: 'Rico genießt ein Paar guter Füße (angeblich)'
      },
      {
        text: 'Welches Tier ähnelt Finn am meisten?',
        image: '',
        answers: ['Bär', 'Border Collie', 'Fisch', 'Wurm'],
        correct: 1,
        explanation: 'Er sieht wirklich so aus!'
      },
      {
        text: 'Wie viele Kinder hat Finn?',
        image: '',
        answers: ['0', '1', '2', 'Mehr als 10'],
        correct: 0,
        explanation: 'Finn wird sicher irgendwann eine nette Familie haben, aber momentan ist er kinderlos'
      },
      { text: 'Wo wohnt Finn?',
        image: '',
        answers: ['Duisburg', 'Schönwehrtstraße 56', 'Südsudan', 'Günderode-Straße 19c', 'Lochness','Görtzer-Straße 9'],
        correct: 1,
        explanation: 'Ich weiß wo du wohnst'
      },
      {
        text: 'Welche Pflanze hört sich ähnlich an wie ein wichtiger Mensch in Finn\'s Leben?',
        image: '',
        answers: ['Brot',  'Lavendel', 'Orchidee','Vanille'],
        correct: 3,
        explanation: 'Keine Erklärung'
      },
      {
        text: 'Warum ist Finn so süß?',
        image: '',
        answers: ['Ist er nicht', 'Veranlagung', 'Das ist unbekannt', 'In der Grundschule erlernt', 'Er imitiert Hundewelpen'],
        correct: 2,
        explanation: 'Niemand weiß wirklich woher er seinen unerklärlichen Charm hat'
      },
       {
        text: 'Gefällt dir dieses Quiz und magst du Finn?',
        image: '',
        answers: ['Vieleicht','Ja','Ja, aber ich will es nicht zugeben'],
        correct: 1,
        explanation: 'Richtig!'
      }
    ];

  // ─────────────────────────────────────────────────────────────
  //  STATE
  // ─────────────────────────────────────────────────────────────
  const KEYS = ['A','B','C','D','E','F'];
  let current  = 0;
  let score    = 0;
  let answered = false;
  let inResult = false;

  // ─────────────────────────────────────────────────────────────
  //  RENDER
  // ─────────────────────────────────────────────────────────────
  function renderQuestion(index) {
    const t   = i18n;
    const qs  = questions;
    const q   = qs[index];
    const total = qs.length;

    document.getElementById('q-label').textContent   = t.questionOf(index + 1, total);
    document.getElementById('q-counter').textContent = t.questionLabel(index + 1);
    document.getElementById('q-text').textContent    = q.text;
    document.getElementById('progress-fill').style.width = ((index / total) * 100) + '%';

    const imgEl = document.getElementById('q-image');
    if (q.image) {
      imgEl.src = q.image;
      imgEl.alt = q.text;
      imgEl.classList.add('show');
    } else {
      imgEl.src = '';
      imgEl.classList.remove('show');
    }

    const nb = document.getElementById('next-btn');
    nb.textContent = index < total - 1 ? t.next : t.showResult;

    const container = document.getElementById('answers');
    container.innerHTML = '';
    q.answers.forEach((ans, i) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.innerHTML = '<span class="answer-key">' + KEYS[i] + '</span><span>' + ans + '</span>';
      btn.addEventListener('click', () => handleAnswer(i));
      container.appendChild(btn);
    });

    // re-apply answered state if re-rendering
    if (answered) {
      const btns = container.querySelectorAll('.answer-btn');
      btns.forEach(b => b.disabled = true);
      btns[q.correct].classList.add('correct');
      // we stored the last chosen index globally
      if (lastChosen !== null && lastChosen !== q.correct) {
        btns[lastChosen].classList.add('wrong');
      }
      const fb = document.getElementById('feedback');
      fb.className = 'feedback ' + (lastChosen === q.correct ? 'correct' : 'wrong') + ' show';
      fb.textContent = lastChosen === q.correct ? t.correct(q.explanation) : t.wrong(q.explanation);
      nb.classList.add('show');
    }
  }

  function load(index) {
    answered  = false;
    lastChosen = null;
    inResult  = false;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').textContent = '';
    document.getElementById('next-btn').className = 'next-btn';
    document.getElementById('score-live').textContent = i18n.points(score);
    document.getElementById('header').textContent  = i18n.header;


    renderQuestion(index);
  }

  // ─────────────────────────────────────────────────────────────
  //  INTERACTION
  // ─────────────────────────────────────────────────────────────
  let lastChosen = null;

  function handleAnswer(chosen) {
    if (answered) return;
    answered   = true;
    lastChosen = chosen;

    const q    = questions[current];
    const t    = i18n;
    const btns = document.querySelectorAll('.answer-btn');
    btns.forEach(b => b.disabled = true);

    const fb = document.getElementById('feedback');

    if (chosen === q.correct) {
      score++;
      btns[chosen].classList.add('correct');
      fb.textContent = t.correct(q.explanation);
      fb.className   = 'feedback correct show';
    } else {
      btns[chosen].classList.add('wrong');
      btns[q.correct].classList.add('correct');
      fb.textContent = t.wrong(q.explanation);
      fb.className   = 'feedback wrong show';
    }

    document.getElementById('score-live').textContent = i18n.points(score);
    document.getElementById('next-btn').classList.add('show');
  }

  document.getElementById('next-btn').addEventListener('click', () => {
    current++;
    if (current < questions.length) {
      load(current);
    } else {
      showResult();
    }
  });

  // ─────────────────────────────────────────────────────────────
  //  RESULT
  // ─────────────────────────────────────────────────────────────
  function showResult() {
    inResult = true;
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('progress-fill').style.width = '100%';

    const t     = i18n;
    const total = questions.length;
    const pct   = Math.round((score / total) * 100);

    let icon, bucket;
    if (pct === 100)     { icon = '🏆'; bucket = 'perfect'; }
    else if (pct >= 67)  { icon = '🎉'; bucket = 'great';   }
    else if (pct >= 34)  { icon = '🤔'; bucket = 'okay';    }
    else                 { icon = '📚'; bucket = 'poor';     }

    document.getElementById('result-icon').textContent  = icon;
    document.getElementById('result-title').textContent = t.results[bucket].title;
    document.getElementById('result-sub').textContent   = t.resultSub(score, total);
    document.getElementById('score-badge').textContent  = score + ' / ' + total;
    document.getElementById('result-quote').textContent = t.results[bucket].quote;
    document.getElementById('restart-btn').textContent  = t.restart;
    //document.getElementById('start-btn').textContent  = t.start;
    document.getElementById('result-screen').className  = 'result show';
  }

  function restart() {
    current = 0; score = 0; inResult = false;
    document.getElementById('result-screen').className = 'result';
    document.getElementById('quiz-screen').style.display = 'block';
   document.getElementById('start').style.display = 'none';

  document.getElementById('card').style.display = 'block';
  document.getElementById('progress').style.display = 'block';
    load(0);
  }

  // ─────────────────────────────────────────────────────────────
  //  INIT
  // ─────────────────────────────────────────────────────────────
  load(0);
</script>
</body>
</html>
